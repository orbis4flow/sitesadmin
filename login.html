<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kivo Admin, Sign in</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="login" class="signin-page">
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>

<main class="signin split">
  <aside class="signin-art" aria-hidden="true">
    <div class="signin-mark"><b>kivo<em>.</em></b></div>
    <svg class="signin-chart" viewBox="0 0 400 220" preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 170 L40 150 L80 160 L120 120 L160 132 L200 96 L240 108 L280 70 L320 84 L360 46 L400 56 L400 220 L0 220 Z" fill="url(#sg)"/>
      <path d="M0 170 L40 150 L80 160 L120 120 L160 132 L200 96 L240 108 L280 70 L320 84 L360 46 L400 56" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/>
    </svg>
  </aside>

  <div class="signin-pane">
  <div class="signin-card">
    <div class="signin-mobile-mark"><b>kivo<em>.</em></b></div>

    <form id="signinForm" novalidate>
      <div class="field-block">
        <label for="email">Work email</label>
        <div class="field"><input id="email" type="email" autocomplete="username"
          placeholder="you@kivobinary.com" autofocus></div>
        <div class="field-error" id="emailError" hidden></div>
      </div>

      <div class="field-block">
        <label for="password">Password</label>
        <div class="field">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button type="button" class="reveal" id="reveal" aria-label="Show password">Show</button>
        </div>
        <div class="field-error" id="passwordError" hidden></div>
      </div>

      <div class="field-error signin-error" id="formError" hidden></div>

      <button class="btn btn-primary signin-go" type="submit" id="go">Sign in</button>
    </form>

    <div class="signin-note" id="gateNote"></div>
  </div>
  </div>
</main>

<script>
(function () {
  var A = window.Admin;

  /* Already signed in? Nothing to do here. */
  if (A.session()) { location.replace('index.html'); return; }

  var form = document.getElementById('signinForm');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var go = document.getElementById('go');

  document.getElementById('reveal').addEventListener('click', function () {
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function setError(id, message) {
    var box = document.getElementById(id);
    box.textContent = message || '';
    box.hidden = !message;
    var wrap = box.previousElementSibling;
    if (wrap && wrap.classList.contains('field')) wrap.classList.toggle('bad', !!message);
  }

  function clearErrors() {
    setError('emailError', '');
    setError('passwordError', '');
    setError('formError', '');
  }

  /* Clear a field's complaint the moment it is corrected. */
  [email, password].forEach(function (input) {
    input.addEventListener('input', function () {
      setError(input.id + 'Error', '');
      setError('formError', '');
    });
  });

  /* Nothing to say when an API is configured, that is the normal case.
     It speaks up only when there is none, because then no password on
     earth will work and that is worth knowing before you try. */
  var note = document.getElementById('gateNote');
  if (window.AdminAPI && window.AdminAPI.live) {
    note.hidden = true;
  } else {
    note.innerHTML = '<b>No API configured.</b> Set <span class="num">apiBase</span> ' +
      'in assets/js/config.js to the address of the Kivo API before signing in.';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors();

    var mail = email.value.trim().toLowerCase();
    var pass = password.value;
    var bad = null;

    if (!mail) { setError('emailError', 'Enter your work email'); bad = bad || email; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) {
      setError('emailError', 'That does not look like an email address');
      bad = bad || email;
    }
    if (!pass) { setError('passwordError', 'Enter your password'); bad = bad || password; }

    if (bad) { bad.focus(); return; }

    go.disabled = true;
    go.innerHTML = A.loader('sm') + 'Checking';

    var operator = null, failure = null;
    try {
      operator = await A.signIn(mail, pass);
    } catch (err) {
      /* A refused role is worth saying plainly, that person has an
         account, it just is not an operator one. Anything else stays
         vague, because naming which half was wrong tells an outsider
         which addresses are real. */
      /* Pass through the reasons that are not about the credentials:
         a refused role, an unreachable API, or no API at all. Anything
         else stays vague, because naming which half was wrong tells an
         outsider which addresses are real. */
      failure = /console|reach|configured/i.test(err.message) ? err.message : null;
    }

    if (!operator) {
      go.disabled = false;
      go.textContent = 'Sign in';
      setError('formError',
        failure || 'That email and password do not match an operator account.');
      password.value = '';
      password.focus();
      return;
    }

    go.innerHTML = A.loader('sm') + 'Opening console';
    location.replace('index.html');
  });
})();
</script>
</body>
</html>
